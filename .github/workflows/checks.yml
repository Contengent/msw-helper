name: Checks
on: [push, pull_request]
jobs:
  helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb xdg-utils desktop-file-utils libglib2.0-bin
      - run: python -m unittest discover -s tests -v
      - run: PYTHONPATH=. xvfb-run -a python tests/gui_smoke.py
      - run: PYTHONPATH=. python tests/desktop_smoke.py
